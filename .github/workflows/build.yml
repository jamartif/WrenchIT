name: Build & Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Creates a draft release on main without pushing the tag by hand.
  # Publishing the draft makes GitHub create the vX.Y.Z tag, and that push runs
  # the build job, which attaches the .vsix to the release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.4)"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  draft-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        # The version comes in through env and is validated in full before use.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version. Use the format 1.2.4"
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$REPO" &>/dev/null; then
            echo "::error::Release v$VERSION already exists"
            exit 1
          fi
          gh release create "v$VERSION" --repo "$REPO" --draft --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Package extension
        run: npx vsce package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrenchit-vsix
          path: "*.vsix"
          retention-days: 90

      # Only runs when a version tag is pushed (e.g. v0.1.0)
      - name: Attach .vsix to release
        if: startsWith(github.ref, 'refs/tags/v')
        # The tag name goes through env: interpolating it into the script would
        # let a tag such as v1$(…) run commands with the release token.
        run: |
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" *.vsix --clobber
          else
            gh release create "$TAG" *.vsix --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
